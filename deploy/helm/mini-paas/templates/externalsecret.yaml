{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Release.Name }}-aws
  labels:
    {{- include "mini-paas.labels" . | nindent 4 }}
spec:
  # Only this namespace may read through the store; tenant namespaces cannot
  # create an ExternalSecret that pulls the platform's secrets.
  conditions:
    - namespaces: [{{ .Release.Namespace | quote }}]
  provider:
    aws:
      service: SecretsManager
      region: {{ $es.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ $es.serviceAccount.name }}
            namespace: {{ $es.serviceAccount.namespace }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "mini-paas.envSecret" . }}
  labels:
    {{- include "mini-paas.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Release.Name }}-aws
  target:
    name: {{ include "mini-paas.envSecret" . }}
    template:
      engineVersion: v2
      data:
        # The password is generated by RDS and may contain URL-reserved characters.
        PAAS_DATABASE_URL: {{ printf "postgresql+psycopg://{{ .db_username }}:{{ .db_password | urlquery }}@%s:%v/%s" .Values.database.host .Values.database.port .Values.database.name | quote }}
        PAAS_JWT_SECRET: {{ `"{{ .jwt_secret }}"` }}
        PAAS_ENCRYPTION_KEY: {{ `"{{ .encryption_key }}"` }}
        PAAS_GITHUB_WEBHOOK_SECRET: {{ `"{{ .webhook_secret }}"` }}
        PAAS_GITHUB_APP_ID: {{ `"{{ .github_app_id }}"` }}
        PAAS_GITHUB_PRIVATE_KEY: {{ `"{{ .github_private_key }}"` }}
        PAAS_GITHUB_CLIENT_ID: {{ `"{{ .github_client_id }}"` }}
        PAAS_GITHUB_CLIENT_SECRET: {{ `"{{ .github_client_secret }}"` }}
  data:
    {{- range $key := list "jwt_secret" "encryption_key" "webhook_secret" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $es.platformSecret }}
        property: {{ $key }}
    {{- end }}
    {{- range $key := list "app_id" "private_key" "client_id" "client_secret" }}
    - secretKey: github_{{ $key }}
      remoteRef:
        key: {{ $es.githubAppSecret }}
        property: {{ $key }}
    {{- end }}
    {{- range $key := list "username" "password" }}
    - secretKey: db_{{ $key }}
      remoteRef:
        key: {{ required "externalSecrets.databaseSecret is required" $es.databaseSecret }}
        property: {{ $key }}
    {{- end }}
{{- end }}
