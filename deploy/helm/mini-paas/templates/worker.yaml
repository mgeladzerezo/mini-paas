apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "mini-paas.labels" . | nindent 4 }}
spec:
  # Exactly one worker: ticks are not coordinated between processes. Recreate
  # guarantees the old one is gone before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mini-paas.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mini-paas.selector" (dict "root" . "component" "worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- include "mini-paas.podSecurityContext" . | nindent 8 }}
      initContainers:
        # Migrations run here rather than in the API pods because this Deployment is
        # the only one that never has two pods starting at the same time.
        - name: migrate
          image: {{ include "mini-paas.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          {{- include "mini-paas.backendEnv" . | nindent 10 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- include "mini-paas.containerSecurityContext" . | nindent 12 }}
      containers:
        - name: worker
          image: {{ include "mini-paas.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.worker"]
          {{- include "mini-paas.backendEnv" . | nindent 10 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- include "mini-paas.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
