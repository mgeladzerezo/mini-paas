{{- if .Values.certManager.createClusterIssuer }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.certManager.clusterIssuer }}
  labels:
    {{- include "mini-paas.labels" . | nindent 4 }}
spec:
  acme:
    server: {{ .Values.certManager.acmeServer }}
    email: {{ .Values.certManager.acmeEmail }}
    privateKeySecretRef:
      name: {{ .Values.certManager.clusterIssuer }}-account-key
    solvers:
      # HTTP-01 works for customer domains too: they only need a CNAME to the ingress,
      # not delegated DNS.
      - http01:
          ingress:
            ingressClassName: {{ .Values.ingress.className }}
{{- end }}
