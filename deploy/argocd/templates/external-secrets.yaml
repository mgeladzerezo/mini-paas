apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  {{- include "apps.metadata" (dict "name" "external-secrets" "wave" 0) | nindent 2 }}
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: {{ .Values.charts.externalSecrets }}
    helm:
      valuesObject:
        installCRDs: true
        serviceAccount:
          name: external-secrets
          annotations:
            eks.amazonaws.com/role-arn: {{ .Values.roleArns.externalSecrets | quote }}
  {{- include "apps.destinationAndSync" (dict "namespace" "external-secrets") | nindent 2 }}
